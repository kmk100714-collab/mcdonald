      // Save group orders pool to localStorage

          base = selectedItem.priceLunch + selectedSide.extraPrice + selectedDrink.extraPrice;
        } else if (mealType === 'set' && selectedItem.priceSet) {

          base = selectedItem.priceSet + 700 + selectedSide.extraPrice + selectedDrink.extraPrice;
        }

        return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      }, [cart]);

        return cart.reduce((sum, item) => sum + item.qty, 0);

        setIsHostModalOpen(false);

      const displayedItems = useMemo(() => {
        if (activeCategory === 'rec') {

        }
        return MENU_ITEMS.filter(item => item.category === activeCategory);

      // Add item to Cart
      const handleAddToCart = () => {
        if (!selectedItem) return;

        let nameFormatted = selectedItem.name;
        if (mealType === 'lunch') nameFormatted += ' (맥런치 세트)';
        else if (mealType === 'set') nameFormatted += ' (일반세트)';
        else if (mealType === 'largeSet') nameFormatted += ' (라지세트)';

        const cartEntry = {
          id: Date.now() + Math.random().toString(36).substr(2, 4),
          itemId: selectedItem.id,
          name: nameFormatted,
          mealType: mealType,
          side: (mealType !== 'single') ? selectedSide.name : null,
          drink: (mealType !== 'single') ? selectedDrink.name : null,
          price: modalCalculatedPrice,
          qty: 1,
          img: selectedItem.img

          const existingIdx = prev.findIndex(ci => 
            ci.itemId === cartEntry.itemId &&
            ci.mealType === cartEntry.mealType &&
            ci.side === cartEntry.side &&
            ci.drink === cartEntry.drink
          );

            copy[existingIdx].qty += 1;
            return copy;

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {submittedOrders.map(ord => (
                    <div key={ord.id} className="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm flex flex-col justify-between gap-3">
                      
                      <div>
                        <div className="flex justify-between items-center pb-2 border-b border-gray-100">
                          <div className="flex items-center gap-2">
                            <span className="bg-mcdRed text-white text-xs font-black px-2 py-0.5 rounded-lg">
                              {ord.studentName}
                            </span>
                            <span className="text-xs text-gray-500 font-bold">{ord.studentId}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md font-bold">
                              {ord.diningType}
                            </span>
                            <span className="text-[10px] text-gray-400 block mt-0.5">{ord.createdAt}</span>
                          </div>
                        </div>

                        {ord.customerNote && (
                          <div className="mt-2 bg-yellow-50 p-2 rounded-xl text-xs text-amber-800 border border-yellow-200/60">
                            <strong>요청사항:</strong> {ord.customerNote}
                          </div>
                        )}

                        <div className="mt-3 space-y-2">
                          {ord.items.map((it, idx) => (
                            <div key={idx} className="flex justify-between text-xs items-center bg-gray-50 p-2 rounded-xl">
                              <div>
                                <p className="font-bold text-gray-800">{it.name} x {it.qty}개</p>
                                {it.side && <p className="text-[10px] text-gray-500">- 사이드: {it.side}</p>}
                                {it.drink && <p className="text-[10px] text-gray-500">- 음료: {it.drink}</p>}
                              </div>
                              <span className="font-extrabold text-gray-700">
                                ₩{(it.price * it.qty).toLocaleString()}원
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="pt-2 border-t border-gray-100 flex justify-between items-center">
                        <span className="text-xs font-bold text-gray-500">개인 주문 합계</span>
                        <span className="text-base font-black text-mcdRed">
                          ₩{ord.totalAmount.toLocaleString()}원
                        </span>
                      </div>

                    </div>
                  ))}
                </div>
              )}

            </div>
          ) : (
            /* STANDARD KIOSK VIEW */
            <div className="flex flex-1 overflow-hidden">
              
              {/* SIDEBAR NAVIGATION (Category Selector) */}
              <nav className="w-28 sm:w-36 bg-gray-50 border-r border-mcdBorder flex flex-col shrink-0 overflow-y-auto">
                {CATEGORIES.map(cat => {
                  const isActive = activeCategory === cat.id;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => setActiveCategory(cat.id)}
                      className={`flex flex-col items-center justify-center py-4 px-2 border-b border-gray-200 transition-all text-center relative ${
                        isActive 
                          ? 'bg-white font-extrabold text-mcdRed border-l-8 border-l-mcdRed shadow-sm' 
                          : 'text-gray-600 hover:bg-gray-100 font-medium'
                      }`}
                    >
                      <span className="text-2xl mb-1">
                        {cat.id === 'rec' && '⭐'}
                        {cat.id === 'burger' && '🍔'}
                        {cat.id === 'happy_snack' && '🏷️'}
                        {cat.id === 'snack' && '🍟'}
                        {cat.id === 'drink' && '🥤'}
                        {cat.id === 'dessert' && '🍦'}
                        {cat.id === 'mcmorning' && '🥞'}
                        {cat.id === 'happymeal' && '🎁'}
                      </span>
                      <span className="text-xs sm:text-sm leading-tight">{cat.name}</span>
                    </button>
                  );
                })}
              </nav>

              {/* ITEM GRID DISPLAY */}
              <main className="flex-1 overflow-y-auto p-4 bg-gray-100">
                <div className="mb-3 flex items-center justify-between">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <span>{CATEGORIES.find(c => c.id === activeCategory)?.name}</span>
                    <span className="text-xs bg-gray-200 text-gray-600 font-normal px-2 py-0.5 rounded-full">
                      {displayedItems.length}개 메뉴
                    </span>
                  </h2>
                  <span className="text-xs text-gray-400">터치하여 메뉴 옵션 선택</span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {displayedItems.map(item => (
                    <div
                      key={item.id}
                      onClick={() => handleItemClick(item)}
                      className="bg-white rounded-2xl p-3 border border-gray-200 shadow-sm hover:shadow-md hover:border-mcdYellow transition-all duration-200 cursor-pointer flex flex-col justify-between group relative overflow-hidden"
                    >
                      <div className="flex gap-1 absolute top-2 left-2 z-10 flex-wrap">
                        {item.priceLunch && (
                          <span className="bg-mcdRed text-white font-extrabold text-[9px] px-1.5 py-0.5 rounded-md shadow-sm">
                            맥런치
                          </span>
                        )}
                        {item.category === 'happy_snack' && (
                          <span className="bg-amber-500 text-white font-extrabold text-[9px] px-1.5 py-0.5 rounded-md shadow-sm">
                            해피스낵
                          </span>
                        )}
                      </div>

                      <div className="text-center my-2 group-hover:scale-105 transition-transform duration-200">
                        <div className="text-5xl my-2 drop-shadow-sm select-none">{item.img}</div>
                        <h3 className="font-bold text-sm text-gray-900 leading-snug line-clamp-2 min-h-[2.5rem]">
                          {item.name}
                        </h3>
                        <p className="text-[11px] text-gray-400 mt-0.5">{item.cal} kcal</p>
                      </div>

                      <div className="mt-2 pt-2 border-t border-gray-100 flex flex-col gap-0.5 text-xs">
                        {item.priceLunch && (
                          <div className="flex justify-between items-center text-mcdRed font-black">
                            <span>런치세트</span>
                            <span>₩{item.priceLunch.toLocaleString()}</span>
                          </div>
                        )}
                        {item.priceSet && (
                          <div className="flex justify-between items-center text-gray-700 font-bold">
                            <span>일반세트</span>
                            <span>₩{item.priceSet.toLocaleString()}</span>
                          </div>
                        )}
                        <div className="flex justify-between items-center text-gray-500">
                          <span>단품</span>
                          <span className="font-semibold">₩{item.priceSingle.toLocaleString()}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </main>
            </div>
          )}

          {/* BOTTOM CART & ORDER SUMMARY BAR (ONLY IN STUDENT MODE) */}
          {userRole === 'student' && (
            <div className="bg-white border-t border-mcdBorder p-3 shadow-2xl shrink-0 z-20">
              {cart.length === 0 ? (
                <div className="text-center py-3 text-gray-400 text-sm flex items-center justify-center gap-2">
                  <span>🛒</span>
                  <span>장바구니가 비어 있습니다. 메뉴를 선택해 주세요.</span>
                </div>
              ) : (
                <div className="flex flex-col gap-2">
                  {/* Cart Preview Horizon Slider */}
                  <div className="flex gap-2 overflow-x-auto pb-1 max-h-24">
                    {cart.map(cItem => (
                      <div 
                        key={cItem.id} 
                        className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-xl p-2 shrink-0 text-xs shadow-sm relative min-w-[180px]"
                      >
                        <span className="text-2xl">{cItem.img}</span>
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-gray-800 truncate">{cItem.name}</p>
                          {cItem.side && <p className="text-[10px] text-gray-500 truncate">+ {cItem.side}</p>}
                          {cItem.drink && <p className="text-[10px] text-gray-500 truncate">+ {cItem.drink}</p>}
                          <p className="font-extrabold text-mcdRed mt-0.5">
                            ₩{(cItem.price * cItem.qty).toLocaleString()}
                          </p>
                        </div>

                        {/* Qty controller */}
                        <div className="flex flex-col items-center gap-1 bg-white border border-gray-200 rounded-lg p-0.5">
                          <button 
                            onClick={() => updateQty(cItem.id, 1)}
                            className="w-5 h-5 bg-gray-100 hover:bg-mcdYellow rounded text-xs font-bold flex items-center justify-center active:scale-95"
                          >
                            +
                          </button>
                          <span className="font-bold text-xs">{cItem.qty}</span>
                          <button 
                            onClick={() => updateQty(cItem.id, -1)}
                            className="w-5 h-5 bg-gray-100 hover:bg-red-100 text-red-600 rounded text-xs font-bold flex items-center justify-center active:scale-95"
                          >
                            -
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Total & Action Buttons */}
                  <div className="flex items-center justify-between pt-2 border-t border-gray-100 gap-3">
                    <div className="flex items-center gap-2">
                      <span className="text-xs bg-mcdRed text-white px-2 py-1 rounded-md font-bold">
                        내 주문 ({totalItemsCount}개)
                      </span>
                      <div>
                        <p className="text-[10px] text-gray-400">내 결제예정금액</p>
                        <p className="text-lg font-black text-mcdRed leading-none">
                          ₩{totalAmount.toLocaleString()}원
                        </p>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setCart([])}
                        className="px-3 py-2 text-xs font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-xl transition-all"
                      >
                        전체 삭제
                      </button>
                      
                      <button
                        onClick={() => setIsHostModalOpen(true)}
                        className="px-5 py-2.5 bg-mcdYellow hover:bg-mcdYellowHover text-mcdDark font-extrabold text-sm rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center gap-2 active:scale-95 border border-amber-400"
                      >
                        <span>✉️ 주문서 제출 / 호스트 전달</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* CUSTOMIZATION MODAL */}
          {selectedItem && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh] animate-in fade-in zoom-in-95 duration-150">
                
                {/* Modal Header */}
                <div className="bg-mcdRed text-white p-4 flex justify-between items-center relative">
                  <div className="flex items-center gap-2">
                    <span className="text-3xl">{selectedItem.img}</span>
                    <div>
                      <h3 className="font-extrabold text-lg leading-tight">{selectedItem.name}</h3>
                      <p className="text-xs text-red-100">{selectedItem.cal} kcal</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setSelectedItem(null)}
                    className="w-8 h-8 rounded-full bg-red-700 hover:bg-red-800 text-white flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Body */}
                <div className="p-4 overflow-y-auto flex-1 flex flex-col gap-5">
                  <p className="text-xs text-gray-600 bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                    {selectedItem.desc}
                  </p>

                  {/* Option 1: Meal Type (Single vs Set vs Lunch) */}
                  {(selectedItem.priceSet || selectedItem.priceLunch) && (
                    <div>
                      <label className="text-xs font-bold text-gray-700 block mb-2">1. 식사 구성 선택</label>
                      <div className="grid grid-cols-3 gap-2">
                        <button
                          onClick={() => setMealType('single')}
                          className={`p-2.5 rounded-2xl border text-center transition-all ${
                            mealType === 'single'
                              ? 'border-mcdRed bg-red-50 text-mcdRed font-bold shadow-sm ring-2 ring-mcdRed/20'
                              : 'border-gray-200 text-gray-600 hover:bg-gray-50'
                          }`}
                        >
                          <div className="text-xs">단품</div>
                          <div className="text-xs font-extrabold mt-1">₩{selectedItem.priceSingle.toLocaleString()}</div>
                        </button>

                        {selectedItem.priceLunch && (
                          <button
                            onClick={() => setMealType('lunch')}
                            className={`p-2.5 rounded-2xl border text-center transition-all ${
                              mealType === 'lunch'
                                ? 'border-mcdRed bg-red-50 text-mcdRed font-bold shadow-sm ring-2 ring-mcdRed/20'
                                : 'border-gray-200 text-gray-600 hover:bg-gray-50'
                            }`}
                          >
                            <div className="text-xs font-extrabold text-mcdRed">🔥 맥런치 세트</div>
                            <div className="text-xs font-black mt-1 text-mcdRed">₩{selectedItem.priceLunch.toLocaleString()}</div>
                            <div className="text-[9px] text-gray-400 mt-0.5">할인가 세트</div>
                          </button>
                        )}

                        {selectedItem.priceSet && (
                          <button
                            onClick={() => setMealType('set')}
                            className={`p-2.5 rounded-2xl border text-center transition-all ${
                              mealType === 'set'
                                ? 'border-mcdRed bg-red-50 text-mcdRed font-bold shadow-sm ring-2 ring-mcdRed/20'
                                : 'border-gray-200 text-gray-600 hover:bg-gray-50'
                            }`}
                          >
                            <div className="text-xs">일반 세트</div>
                            <div className="text-xs font-extrabold mt-1">₩{selectedItem.priceSet.toLocaleString()}</div>
                            <div className="text-[9px] text-gray-400 mt-0.5">버거+사이드+음료</div>
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Option 2: Side Selection (If Set/Lunch) */}
                  {mealType !== 'single' && (selectedItem.priceSet || selectedItem.priceLunch) && (
                    <div>
                      <label className="text-xs font-bold text-gray-700 block mb-2">2. 사이드 메뉴 변경</label>
                      <div className="flex flex-col gap-1.5 max-h-36 overflow-y-auto pr-1">
                        {SIDES_OPTIONS.map(side => (
                          <div
                            key={side.id}
                            onClick={() => setSelectedSide(side)}
                            className={`p-2.5 rounded-xl border flex items-center justify-between text-xs cursor-pointer transition-all ${
                              selectedSide.id === side.id
                                ? 'border-mcdRed bg-red-50 font-bold text-mcdRed'
                                : 'border-gray-200 text-gray-700 hover:bg-gray-50'
                            }`}
                          >
                            <span>{side.name}</span>
                            <span className="text-gray-500 font-semibold">
                              {side.extraPrice > 0 ? `+₩${side.extraPrice.toLocaleString()}` : '추가금 없음'}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Option 3: Drink Selection (If Set/Lunch) */}
                  {mealType !== 'single' && (selectedItem.priceSet || selectedItem.priceLunch) && (
                    <div>
                      <label className="text-xs font-bold text-gray-700 block mb-2">3. 음료 메뉴 변경</label>
                      <div className="flex flex-col gap-1.5 max-h-36 overflow-y-auto pr-1">
                        {DRINKS_OPTIONS.map(dr => (
                          <div
                            key={dr.id}
                            onClick={() => setSelectedDrink(dr)}
                            className={`p-2.5 rounded-xl border flex items-center justify-between text-xs cursor-pointer transition-all ${
                              selectedDrink.id === dr.id
                                ? 'border-mcdRed bg-red-50 font-bold text-mcdRed'
                                : 'border-gray-200 text-gray-700 hover:bg-gray-50'
                            }`}
                          >
                            <span>{dr.name}</span>
                            <span className="text-gray-500 font-semibold">
                              {dr.extraPrice > 0 ? `+₩${dr.extraPrice.toLocaleString()}` : '추가금 없음'}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* Modal Footer / Add Button */}
                <div className="p-4 bg-gray-50 border-t border-gray-100 flex items-center justify-between gap-3">
                  <div>
                    <p className="text-[10px] text-gray-400">선택 항목 합계</p>
                    <p className="text-lg font-black text-mcdRed">
                      ₩{modalCalculatedPrice.toLocaleString()}원
                    </p>
                  </div>

                  <button
                    onClick={handleAddToCart}
                    className="flex-1 py-3 bg-mcdYellow hover:bg-mcdYellowHover text-mcdDark font-extrabold text-sm rounded-2xl shadow-md transition-all text-center"
                  >
                    장바구니에 담기
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* SEND TO HOST MODAL */}
          {isHostModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh] animate-in fade-in zoom-in-95 duration-150">
                
                {/* Header */}
                <div className="bg-mcdDark text-white p-4 flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📋</span>
                    <div>
                      <h3 className="font-extrabold text-base text-mcdYellow">주문서 제출 및 전달</h3>
                      <p className="text-xs text-gray-300">주문자 학번과 이름으로 호스트 시스템에 제출합니다.</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsHostModalOpen(false)}
                    className="text-gray-400 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Content */}
                <div className="p-4 overflow-y-auto flex-1 flex flex-col gap-4">
                  
                  {/* Student Info Verification */}
                  <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200 flex items-center justify-between text-xs">
                    <div>
                      <span className="text-gray-500 font-bold block">주문자 정보:</span>
                      <span className="font-black text-gray-800 text-sm">
                        {studentId || '(학번 미입력)'} {studentName || '(이름 미입력)'}
                      </span>
                    </div>
                    <span className="text-xs bg-mcdRed text-white px-2.5 py-1 rounded-full font-bold">
                      {diningType === 'eatIn' ? '매장 식사' : '포장'}
                    </span>
                  </div>

                  {/* Customer Note Input */}
                  <div>
                    <label className="text-xs font-bold text-gray-700 block mb-1">
                      호스트에게 전달할 요청사항 (선택)
                    </label>
                    <input
                      type="text"
                      placeholder="예: 피클 빼주세요, 얼음 적게 부탁드립니다"
                      value={customerNote}
                      onChange={(e) => setCustomerNote(e.target.value)}
                      className="w-full text-xs p-2.5 border border-gray-300 rounded-xl focus:outline-none focus:border-mcdRed"
                    />
                  </div>

                  {/* Formatted Text Box */}
                  <div>
                    <label className="text-xs font-bold text-gray-700 block mb-1">생성된 전송용 텍스트</label>
                    <textarea
                      readOnly
                      rows="7"
                      value={`[맥도날드 키오스크 주문 요청서]\n--------------------------\n• 주문자: ${studentId} ${studentName}\n• 식사 방식: ${diningType === 'eatIn' ? '매장 식사' : '포장'}\n${customerNote ? '• 요청사항: ' + customerNote + '\n' : ''}--------------------------\n[주문 내역]\n` + cart.map((item, i) => `${i+1}. ${item.name} x ${item.qty}개 (₩${(item.price * item.qty).toLocaleString()}원)\n${item.side ? '   - 사이드: ' + item.side + '\n' : ''}${item.drink ? '   - 음료: ' + item.drink + '\n' : ''}`).join('') + `--------------------------\n개인 주문 금액: ₩${totalAmount.toLocaleString()}원`}
                      className="w-full text-xs font-mono p-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 leading-relaxed resize-none focus:outline-none"
                    ></textarea>
                  </div>

                </div>

                {/* Actions */}
                <div className="p-4 bg-gray-50 border-t border-gray-100 flex flex-col gap-2">
                  <button
                    onClick={handleSendOrderToGroupPool}
                    className="w-full py-3.5 bg-mcdRed hover:bg-red-700 text-white font-extrabold text-sm rounded-2xl shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <span>🚀 호스트에게 주문서 직접 제출하기</span>
                  </button>

                  <div className="flex gap-2">
                    <button
                      onClick={handleCopyHostText}
                      className={`flex-1 py-2.5 px-3 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1 border ${
                        copiedText
                          ? 'bg-green-600 text-white border-green-600'
                          : 'bg-mcdYellow hover:bg-mcdYellowHover text-mcdDark border-amber-300'
                      }`}
                    >
                      <span>{copiedText ? '✓ 텍스트 복사완료' : '📋 텍스트 복사'}</span>
                    </button>

                    <button
                      onClick={() => {
                        if (navigator.share) {
                          navigator.share({
                            title: '맥도날드 주문서',
                            text: formattedOrderText
                          }).catch(() => {});
                        } else {
                          handleCopyHostText();
                        }
                      }}
                      className="py-2.5 px-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold text-xs rounded-xl transition-all"
                    >
                      카톡/공유
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
